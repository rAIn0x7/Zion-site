  '其实,今天想穿什么颜色就穿。这件事从来不用请示谁,也不用等一张色卡点头。'];

/* ── 工具 ── */
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const YEAR=new Date().getFullYear();
const fill=(s,m)=>String(s).replace(/\{C\}/g,m.C).replace(/\{A\}/g,m.A).replace(/\{Y\}/g,YEAR);
function hexToHsl(hex){
  let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
  if(mx!==mn){const dd=mx-mn;s=l>0.5?dd/(2-mx-mn):dd/(mx+mn);
    if(mx===r)h=(g-b)/dd+(g<b?6:0);else if(mx===g)h=(b-r)/dd+2;else h=(r-g)/dd+4;h*=60;}
  return [h,s,l]; // h:0-360 s,l:0-1
}
function textOn(hex){const [,,l]=hexToHsl(hex);return l>0.62?'#2b2721':'#fdfbf6';}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,Math.round(v)));

const cfg={ id:'sekapian', 名字:'本命色卡', 图标:'🎨' };

$('go').onclick=()=>{
  const nick=$('nick').value.trim();
  if(!nick){$('err').textContent='先写下你的名字吧,颜色在等一个主人 🎨';return;}
  const bday=$('bday').value||'';
  $('err').textContent='';$('ce-stage').style.display='none';$('loading').style.display='block';
  setTimeout(()=>{
    const seed=nick+'|'+bday;                        // 同名字+同生日 → 结果永远固定
    const rng=CE.rngFrom(seed);

    // 主色:按种子从色板挑 1 个
    const main=PALETTE[Math.floor(rng()*PALETTE.length)];
    // 辅助色:从其余色里洗牌取 3 个(确定性)
    const rest=PALETTE.filter(c=>c.n!==main.n);
    for(let i=rest.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=rest[i];rest[i]=rest[j];rest[j]=t;}
    const aux=rest.slice(0,3);

    // 由主色 HSL 推导四维(确定性,带轻微种子抖动)
    const [hh,ss,ll]=hexToHsl(main.h);
    const jit=()=>rng()*10-5;
    const adv =clamp(60+(1-ss)*26+jit(),62,98);      // 高级感:越低饱和越高级
    const gen =clamp(46+ll*40+(1-ss)*16+jit(),48,99);// 温柔度:越浅越柔
    const en  =clamp(34+ss*54+ll*10+jit(),42,99);    // 能量值:越艳越有能量
    const myst=clamp(42+(1-ll)*38+((hh>=200&&hh<=300)?12:0)+jit(),46,99); // 神秘度:越深越蓝紫越神秘
    const match=clamp(85+rng()*14,85,99);            // 本命契合度:高且因人而异
    const dims=[['高级感',adv],['温柔度',gen],['能量值',en],['神秘度',myst]];

    // 分段文案(确定性)
    const trait =CE.pick(rng,TRAIT[main.f]||TRAIT.cool);
    const auxNames=aux.map(c=>c.n).join('」、「');
    const fate  =fill(CE.pick(rng,FATE),{C:main.n});
    const lucky =fill(CE.pick(rng,LUCKY),{C:main.n,A:auxNames});
    const style =fill(CE.pick(rng,STYLE),{C:main.n});
    const prov  =CE.pick(rng,PROVERB);

    // 生日只进种子,不印在任何可截图的地方(完整出生日期属 PII,对读者也没信息量)
    const subLine=nick+(bday?' · 已按生日微调':'');

    const parts=[
      {h:'🎨 你的专属色卡', p:''},                     // 色卡富文本注入到这里(可见,值得截图)
      {h:'🌈 「'+main.n+'」是一种怎样的性格', p:main.d+' '+trait},
      {h:'🔗 你和这个颜色的缘分', p:fate},
      {h:'🍀 '+YEAR+' 幸运色 · 这样搭', p:lucky},
      {h:'👗 穿搭 / 头像 小建议', p:style},
      {h:'🌙 一句色彩箴言', p:prov}
    ];

    const result={
      heading:'本命色卡', tag:'本命色 · '+main.n, sub:subLine,
      big:match, bigLabel:'本命契合度', dims, parts,
      card:{ kicker:'🎨 本命色卡', title:nick+' · '+main.n,
             /* sub 去掉:色名和 hex 下方大色块里已有;生日属 PII,分享卡上不印 */
             colorcard:{ main:{hex:main.h, name:main.n}, aux:aux.map(c=>({hex:c.h, name:c.n})) },
             big:match, bigLabel:'本命契合度', dims, hook:main.d },
      shareText:'我的本命色是「'+main.n+'」,你的呢👉 qizh.space/ce/sekapian'
    };

    // 色卡 HTML(小红书风纸感卡)
    const auxHtml=aux.map(c=>
      '<div class="sk-chip"><span class="sw" style="background:'+c.h+'"></span><b>'+c.n+'</b><i>'+c.h.toUpperCase()+'</i></div>').join('');
    const cardHtml=
      '<div class="sk-card" id="skCard">'
      +'<div class="sk-top"><span class="sk-kick">SEKAPIAN 本命色卡</span><span class="sk-idx">No.'+(PALETTE.indexOf(main)+1).toString().padStart(2,'0')+' · '+YEAR+'</span></div>'
      +'<div class="sk-hero" style="background:'+main.h+';color:'+textOn(main.h)+'">'
        +'<span class="sk-hero-lb">本命主色</span>'
        +'<div class="sk-hero-name">'+main.n+'</div>'
        +'<div class="sk-hero-hex">'+main.h.toUpperCase()+'</div>'
      +'</div>'
      +'<div class="sk-mood">'+main.d+'</div>'
      +'<div class="sk-aux">'+auxHtml+'</div>'
      +'<div class="sk-foot"><b>'+esc(nick)+'</b> · 我的专属色卡</div>'
      +'</div>';

    $('loading').style.display='none';
    CE.render(cfg, result);
    injectCard(cardHtml);
  },600);
};

/* 把首段 <p>(空)替换为色卡,并触发入场动画 */
function injectCard(html){
  const first=document.querySelector('#ce-body .ce-sec p');
  if(!first)return;
  first.innerHTML=html;first.style.margin='0';
  requestAnimationFrame(()=>{setTimeout(()=>{const c=document.getElementById('skCard');if(c)c.classList.add('in');},60);});
}
</script>
<script src="/wxtip.js" defer></script>
