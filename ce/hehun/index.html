let rel='情侣';

const cfg={ id:'hehun', 名字:'AI 合婚', 图标:'💞',
  sections:[
    {h:'💘 缘分总览', pools:[[
      ['你俩这组合,一见面空气里就有电流——不是一般的对眼。',3],
      ['缘分是有的,但属于"慢炖型",越处越香那种。',3],
      ['你俩的缘分像 WiFi 满格,信号强到隔着一屋子人都能自动连上。',3],
      ['第一眼可能不惊艳,可越看越顺眼,后劲大得像后劲很大的酒。',2],
      ['你俩像磁铁的两极,离不开也常互相拉扯,分分合合能演八季。',2],
      ['天生自带默契频道,一个眼神就能对上暗号,旁人完全插不进话。',3],
      ['属于"欢喜冤家"款,吵吵闹闹反而黏得更紧,一天不斗嘴浑身难受。',2],
      ['你俩这缘分是那种"命里躲不掉"的,兜兜转转还是会撞回一起。',2],
      ['缘分浓度爆表,只是配方里辣椒放多了:甜的时候齁甜,辣的时候呛人。',2],
      ['你俩像两只互相取暖的刺猬,靠太近扎手、离太远又冷,得慢慢磨那个距离。',2],
      ['第一印象大概率是互相看不上,结果打脸打得啪啪响,真香。',1.5],
      ['你俩的频率天然对得上,别人聊三小时的进度,你俩五分钟就到位。',2],
      ['你俩这缘分像连续剧,前几集平平无奇,越往后越舍不得关。',2],
      ['一个负责发疯、一个负责收拾残局,分工明确,这缘分反而稳。',2],
      ['你俩是那种"朋友都看出来了、就你俩还在装傻"的经典组合。',1.5]]]},
    {h:'🧩 性格契合', pools:[[
      ['一个爱冲、一个能稳,正好互补,谁也别嫌谁。',3],
      ['两个都是有主意的人,好处是聊得来,坏处是都不爱先低头,能僵一整天。',3],
      ['一个负责制造快乐、一个负责踩刹车,搭配起来日子不会翻车。',2],
      ['性格像得吓人,优点缺点都同款——爽起来很爽,踩雷也一起踩。',2],
      ['一个外放一个内敛,刚好一个把话说出口、一个把事放心里。',2],
      ['你俩都是嘴硬心软型,明明在乎得要死,偏要装作无所谓。',3],
      ['一个 E 人一个 I 人:出门 E 人负责社交,回家 I 人负责回血,绝配。',3],
      ['两个都是"计划赶不上变化"选手,好在都随遇而安,乱中有序。',2],
      ['一个理性得像 Excel、一个感性得像抒情诗,吵起来根本不在一个频道。',2],
      ['都是拖延症晚期:好处是互相理解,坏处是没人催,事儿全烂在手里。',2],
      ['一个话痨一个树洞,一个负责输出一个负责点头,天生的黄金搭档。',2],
      ['你俩都是"刀子嘴豆腐心",互相扎心又互相心疼,外人看着都替你俩累。',2],
      ['一个记仇一个健忘,刚好一个负责翻旧账、一个负责已读即忘,扯平了。',1.5],
      ['两个都是"我没事"专业户,有事全憋着,建议定期强制交心一次。',2]]]},
    {h:'⚡ 沟通雷区', pools:[[
      ['最大的雷是"我以为你懂",别猜,把话讲明白就没事。',3],
      ['冷战是你俩的头号杀手——谁先服软谁就是赢家,别硬撑。',3],
      ['容易在小事上较真,记住:赢了道理、输了感情,亏大了。',2],
      ['一个想聊、一个想静,给彼此留点独处的空当会更顺。',2],
      ['翻旧账是禁区,一翻就炸,就事论事能救你俩很多次架。',3],
      ['你俩吵架爱甩"随便你"三个字,杀伤力堪比核弹,慎用。',3],
      ['最容易在"到底吃什么"这种世纪难题上互相消耗,建议轮流做决定。',2],
      ['一个想被哄、一个不会看眼色,雷区就埋在"你为什么还不主动"。',2],
      ['忌报喜不报忧,小情绪憋久了会攒成大账单,一次性爆发很吓人。',2],
      ['你俩容易把"开玩笑"玩过火,分寸感是必修课,别拿痛处当梗。',2],
      ['最大的坑是各自脑补:一个已经想到分手,另一个还在想晚饭吃啥,离谱。',2],
      ['忌当着外人的面拆台,面子这东西,给对方留一点,日子好过很多。',2],
      ['一句"你变了"能瞬间点燃战火,少用这种上纲上线的句式。',1.5],
      ['手机是你俩的隐形第三者,吃饭时把它扣桌上,关系立刻升温。',2]]]},
    {h:'🔥 旺不旺 · 给你的建议', pools:[[
      ['你俩互相旺——TA 会把你往更好的方向带,值得用心。',3],
      ['这段关系旺事业也旺心态,是那种"越处越像样"的组合。',2],
      ['旺是旺,但得两个人都往里投入,单方面使劲会累到怀疑人生。',2],
      ['短期火花足,长期靠的是"把浪漫落进日常"的本事。',2],
      ['缘分给了开头,能走多远看你俩愿不愿意为对方改一点点。',3],
      ['你俩在一起会越来越有钱缘——不是玄学,是彼此都想让对方过更好。',2],
      ['TA 是你的"情绪充电宝",累的时候往 TA 那儿一靠,电量就回来了。',3],
      ['这组合旺桃花还旺食欲,小心处着处着就一起悄悄胖了三斤。',2],
      ['你俩最旺的是"事业合伙人"属性,一起搞点啥,大概率能成。',2],
      ['少说"都行、随便、无所谓",多说"我想和你一起",立竿见影。',2],
      ['你俩适合定期给关系充"仪式感":纪念日别嫌俗,俗气的浪漫最养人。',2],
      ['旺归旺,别把对方当理所当然——再旺的火,不添柴也会灭。',2],
      ['多夸对方、少挑刺,你俩的运势会跟着好话一起水涨船高。',1.5],
      ['把"为你好"换成"我陪你",这段关系立刻从紧张模式切到治愈模式。',2]]]}
  ]};

const TAG1=['互补','同频','冰火','欢喜冤家','细水长流','一见如故','拉扯','治愈','上头','慢热','双向奔赴','相爱相杀','清醒','爆火花','磁场','对味'];
const TAG2=['拉扯型','治愈型','黄金搭子','冒险家','过命之交','慢热型','互宠型','互怼型','合伙人','显眼包组合','搞钱搭档','养生局','事业线','嘴替型','充电宝','soulmate'];
const RARE=[['天生一对·万里挑一',0.04],['前世冤家·相爱相杀',0.05],['贵人式姻缘',0.05],['祖传绝配·原厂配对',0.03],['互为嘴替·灵魂双胞胎',0.04],['官宣预定款·亲友团催得最凶那对',0.04]];

$('go').onclick=()=>{
  const a=$('na').value.trim(), b=$('nb').value.trim();
  if(!a||!b){$('err').textContent='把两个名字都填上呀 💞';return;}
  $('err').textContent='';$('ce-stage').style.display='none';$('loading').style.display='block';
  setTimeout(()=>{
    const seed=[a,b].sort().join('&')+'|'+rel;
    const rng=CE.rngFrom(seed);
    const parts=CE.buildParts(cfg,rng);
    // 稀有特殊(加权)
    let rare='';RARE.forEach(r=>{if(!rare&&rng()<r[1])rare=r[0];});
    if(rare)parts.push({h:'✨ 特殊缘分', p:'你俩居然测出了「'+rare+'」——这种缘分几百对里才蹦出一对,截图存好别弄丢了。'});
    const tag='【'+CE.pick(rng,TAG1)+CE.pick(rng,TAG2)+'】';
    /* 四维先出;稀有缘分整体抬升各维基线(彩蛋 → 维度高 → 总分自然高) */
    const D=(lo,hi)=>Math.min(99,Math.round(lo+rng()*(hi-lo)));
    /* 分数整体偏高是刻意的:这是娱乐工具,人爱听好话,低分没人愿意截图转发 */
    const dXin  = rare?D(90,99):D(72,97);   // 心动
    const dMo   = rare?D(90,99):D(72,97);   // 默契
    const dMag  = rare?D(86,97):D(68,94);   // 磨合
    const dChang= rare?D(91,99):D(71,97);   // 长久
    const dims=[['💘心动',dXin],['🤝默契',dMo],['⚡磨合',dMag],['💍长久',dChang]];
    /* 配对度 = 四维加权平均(长久/默契最能决定一段关系走多远)+ 微扰,并锁死在四维区间内 */
    const _w=0.22*dXin+0.28*dMo+0.18*dMag+0.32*dChang;
    const _lo=Math.min(dXin,dMo,dMag,dChang), _hi=Math.max(dXin,dMo,dMag,dChang);
    const score=Math.max(_lo,Math.min(_hi,Math.round(_w+(rng()*4-2))));
    const result={
      heading:'你俩的配对度', tag, sub:a+' × '+b+' · '+rel,
      big:score, bigLabel:'配对度', dims, parts,
      card:{kicker:'💞 AI 合婚 · 配对度', title:tag, sub:a+' × '+b, big:score, bigLabel:'配对度', dims, hook:(parts[0]&&parts[0].p)||''},
      shareText:'我和 TA 的配对度是 '+score+' 分!'+tag+' 来测测你俩的 👉 qizh.space/ce/hehun'
    };
    $('loading').style.display='none';
    CE.render(cfg, result);
  },600);
};
</script>
