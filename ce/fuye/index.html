<script>
const $=id=>document.getElementById(id);
const cfg={ id:'fuye', 名字:'副业方向测评', 图标:'💼' };

/* 每题默认选中第一项 → 答完即可出结果 */
const QS=['q1','q2','q3','q4','q5','q6'];
const sel={q1:'write',q2:'content',q3:'t30',q4:'safe',q5:'in',q6:'fast'};
QS.forEach(q=>{
  $(q).querySelectorAll('button').forEach(b=>b.onclick=()=>{
    $(q).querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');sel[q]=b.dataset.v;
  });
});

/* ── 副业方向内容库(8 个方向,覆盖常见路子)──
   每个:name/icon/why[变体]/step/money/diff/ret/short ── */
const DIRS={
  media:{name:'自媒体 / 内容创作',icon:'📱',short:'内容创作',
    why:['你有表达欲和内容手感,做自媒体是把"你的想法"变成可复利资产的最佳路径——写一次、被看无数次。',
         '你适合靠内容说话:持续输出你懂的、你信的,把一群同频的人聚过来,后面变现的门自然会打开。'],
    step:'选一个你能持续聊 3 个月的细分主题(如"打工人省钱""AI 工具"),先在公众号/小红书/视频号发满 20 条,把手感和账号权重养起来。',
    money:'广告/商单、带货佣金、引流到私域卖课或社群、平台流量分成。',
    diff:'难度 中',ret:'回报 慢热但复利'},
  outsource:{name:'技能接单 / 自由接活',icon:'🧰',short:'技能接单',
    why:['你有一门能交付的手艺,接单是最快见钱的路:不用囤货、不用等涨粉,做完就结,现金流最实在。',
         '你务实、能独立交付,把技能挂到平台接单,时间换钱、多劳多得,是零成本启动副业的稳妥首选。'],
    step:'把你最强的一项技能(设计/写作/剪辑/翻译/代码)整理 3 个作品样例,挂到闲鱼/小红书/猪八戒/朋友圈,先接 3 单打口碑。',
    money:'按单/按项目收费,做熟后接长期客户、涨单价,或做成小工作室带人放大。',
    diff:'难度 低',ret:'回报 快·线性'},
  ecom:{name:'轻电商 / 无货源带货',icon:'🛒',short:'轻电商',
    why:['你对"买卖"有感觉、执行力强,轻电商门槛低:不囤货也能上手,靠选品和流量赚差价。',
         '你愿意动手试、也扛得住试错,从闲鱼/无货源小店起步,是普通人离"卖货赚钱"最近的一条路。'],
    step:'从闲鱼卖闲置或做"无货源"选品起步,先跑通"选品→上架→出单→发货"整个流程,哪怕第一个月只赚几百也先跑通。',
    money:'商品差价、店铺利润;跑通后放大 SKU、投流,或转向直播/短视频带货。',
    diff:'难度 中',ret:'回报 中·看选品'},
  knowledge:{name:'知识付费 / 咨询',icon:'🎓',short:'知识付费',
    why:['你有一块别人愿意付费学的专业积累,把它做成课程/咨询/社群,是把"经验"直接变现的高毛利路子。',
         '你懂某个领域比大多数人深,别自己埋没——把它拆成能教的东西,一份内容反复卖,毛利极高。'],
    step:'把你的专长拆成一个"能解决具体问题"的小课或咨询服务(如"简历修改""考研规划"),先在朋友圈/社群卖出第一份,收集反馈迭代。',
    money:'课程/专栏、1v1 咨询、付费社群/星球、陪跑训练营。',
    diff:'难度 中',ret:'回报 高毛利'},
  aitool:{name:'AI 工具 / AI 副业',icon:'🤖',short:'AI 副业',
    why:['你懂技术或爱折腾工具,正踩在 AI 红利上:用 AI 做号、做工具、代做需求,能一个人干出一支团队的活。',
         '你适合借 AI 放大产能:把重复劳动交给 AI,自己做那个"会用工具的人",效率碾压不会用的人。'],
    step:'选一个具体场景(AI 做小红书图文、AI 剪视频、AI 写文案、搭个小工具),先用它帮自己/帮别人做出 10 个成品,跑通"AI+需求"的闭环。',
    money:'AI 代做接单、卖 AI 工具/模板/提示词、做 AI 主题内容账号引流、SaaS 小工具订阅。',
    diff:'难度 中',ret:'回报 高·踩红利'},
  offline:{name:'本地 / 同城副业',icon:'📍',short:'同城副业',
    why:['你外向、能跑能聊,本地生意反而是蓝海:同城需求真实、竞争没线上卷,靠勤快和人脉就能吃到。',
         '你适合"接地气"地赚钱:摆摊、探店、跑腿、同城服务,离钱近、见效快,适合先赚起来再说。'],
    step:'挑一个你所在城市有真实需求的小生意(周末摆摊、探店代拍、宠物上门、跑腿代办),先做一个周末验证有没有人买单。',
    money:'摆摊/服务收入、探店商单、同城社群团购分成、本地商家合作。',
    diff:'难度 低',ret:'回报 快·靠勤快'},
  hobby:{name:'兴趣变现',icon:'🎨',short:'兴趣变现',
    why:['你有审美/手艺/热爱,把兴趣做成作品和服务,是最不容易坚持不下去的副业——因为你本来就喜欢。',
         '你适合"把喜欢的事做出钱来":手作、摄影、健身、绘画……做到别人愿意为它付费,快乐和收入双拿。'],
    step:'把你的兴趣做出 5 个能拿得出手的成品(手作/照片/健身计划),发到小红书/朋友圈,先接第一个愿意付费的人。',
    money:'作品/成品售卖、约拍/私教/定制服务、开课教同好、接品牌合作。',
    diff:'难度 中',ret:'回报 中·可持续'},
  info:{name:'信息差 / 资源整合',icon:'🔗',short:'信息差',
    why:['你脑子活、会搜会聊,信息差生意几乎零成本:你知道别人不知道的、连接供需两端,就能赚中间的钱。',
         '你适合做"连接器":整合资源、撮合供需、搬运信息差,不用技能不用囤货,靠信息和人脉就能变现。'],
    step:'找一个你有信息优势的小切口(某类货源、某种服务、某个圈子的需求),先撮合成一单,验证"信息差"真能换钱。',
    money:'中介/撮合佣金、代购/选品差价、付费信息/资源社群、返利与渠道分成。',
    diff:'难度 低',ret:'回报 快·轻资产'}
};

/* ── 打分:每个选项给若干方向加分 ── */
const W={
  q1:{write:{media:2,knowledge:1,outsource:1},design:{outsource:2,media:1,hobby:1},tech:{aitool:2,outsource:1},
      talk:{ecom:1,offline:2,info:1},pro:{knowledge:2,media:1},none:{ecom:1,offline:1,info:1,aitool:1}},
  q2:{content:{knowledge:2,media:2},video:{media:2,hobby:1},goods:{ecom:2,info:1},techf:{aitool:2,outsource:1},
      life:{hobby:2,offline:1},money:{ecom:1,info:1,aitool:1}},
  q3:{t30:{info:2,aitool:1,ecom:1},t12:{media:1,outsource:1,knowledge:1},t3:{media:1,ecom:1,hobby:1,outsource:1},
      week:{hobby:1,offline:2,outsource:1}},
  q4:{safe:{outsource:2,media:1,aitool:1,info:1},small:{ecom:1,knowledge:1,hobby:1},bold:{ecom:2,offline:1,info:1}},
  q5:{in:{outsource:1,aitool:1,media:1,knowledge:1},out:{offline:2,ecom:1,info:1},
      create:{media:1,hobby:1,knowledge:1},do:{outsource:1,ecom:1,offline:1}},
  q6:{fast:{outsource:2,ecom:1,offline:1},grow:{media:1,knowledge:1,aitool:1},
      passive:{aitool:1,knowledge:1,media:1,info:1},learn:{knowledge:1,media:1,aitool:1}}
};

const SUMMARY=[
  '别在"要不要开始"上纠结太久——副业最大的门槛从来不是天赋,是"先做起来"。上面第一个方向,这周末就能迈第一步。',
  '选定一个方向,先做满 90 天再评判值不值——大多数人不是不适合,是死在了"还没看到结果就放弃"。',
  '副业不用一上来就辞职 all in,用最小成本先跑通"从 0 到 1 块钱",赚到第一笔,你的心态和打法都会变。',
  '别贪多,上面三个方向挑最想做的那一个,把它做深做透——同时开三个坑,通常一个都填不满。',
  '你的答案已经指明了方向,剩下的只差行动。记住:做起来永远比想明白更重要,答案在路上。'
];

$('go').onclick=()=>{
  $('err').textContent='';$('ce-stage').style.display='none';$('loading').style.display='block';
  setTimeout(()=>{
    // 累加得分
    const score={};Object.keys(DIRS).forEach(k=>score[k]=0);
    QS.forEach(q=>{const add=W[q][sel[q]]||{};for(const k in add)score[k]+=add[k];});
    // 种子=答案串 → 同答案永远同结果;并列时用 rng 稳定打散
    const ansSeed=QS.map(q=>sel[q]).join('|');
    const rng=CE.rngFrom(ansSeed);
    const ranked=Object.keys(DIRS).sort((a,b)=>{
      if(score[b]!==score[a])return score[b]-score[a];
      // 并列:用种子稳定决定先后(可复现)
      return rng()<0.5?-1:1;
    });
    const top=ranked.slice(0,3);
    const maxS=score[top[0]]||1;
    const p=arr=>CE.pick(rng,arr);

    const parts=[];
    const medals=['🥇 最适合你','🥈 也很适合','🥉 可以考虑'];
    top.forEach((k,i)=>{
      const d=DIRS[k];
      const body=p(d.why)
        +'\n\n🚀 起步第一步:'+d.step
        +'\n\n💰 怎么变现:'+d.money
        +'\n\n🏷️ '+d.diff+' · '+d.ret;
      parts.push({h:medals[i]+':'+d.icon+' '+d.name, p:body});
    });
    parts.push({h:'📊 一句总评', p:p(SUMMARY)});

    // 四维:top3 契合度(按最高分归一)
    const dims=top.map(k=>[DIRS[k].short, Math.min(99, Math.round(score[k]/maxS*88)+11)]);
    const top1=DIRS[top[0]];
    const tag='【副业方向:'+top1.short+'】';

    const result={
      heading:'你的副业方向', tag, sub:'最适合你的 '+top.length+' 个方向已就位',
      big:dims[0][1], bigLabel:'最高契合', dims, parts,
      card:{ kicker:'💼 副业方向测评', title:top1.icon+' '+top1.short, sub:'契合度 '+dims[0][1], big:dims[0][1], bigLabel:'最高契合', dims,
             hook:(top1.why&&top1.why[0])||'' },
      shareText:'我测出最适合我的副业方向是「'+top1.short+'」!你适合搞什么副业?来测测 👉 qizh.space/ce/fuye'
    };

    $('loading').style.display='none';
    CE.render(cfg, result);
  },600);
};
</script>
<script src="/wxtip.js" defer></script>
