<script>
const $=id=>document.getElementById(id);

/* ── 走心/毒舌反思(按人生已用 % 分档;先给画面感的清醒,不纯丧)── */
const REFLECT={
  young:[ // <25
    '你的进度条才刚过开头,大片空白还没被写上字。别急着把整条路都规划死,先把眼前这段走得够野。你现在浪费掉的时间,以后会变成有故事的时间。',
    '你还在人生的清晨,天没全亮,路也看不太清,这很正常。这个阶段走错的成本其实很低,趁现在多试几个方向,比早早锁死一条路划算得多。',
    '进度条走过头四分之一,你手里最贵的东西是「还来得及」。别把它全花在讨好每一个人身上,留一点给那个还没被定义的自己。'],
  rise:[ // 25-42
    '你正走在爬坡这段,体力最好,也最容易被榨干。这几年做的事会决定后面很长一程的样子,但也别把每个决定都当成生死攸关,大多数选择其实都能回头。',
    '进度条过了三分之一,你开始察觉时间是会加速的。别再等「以后有空」,那个空档多半不会来。想做的事挑一件,这个月就动手。',
    '你现在同时握着精力和一点经验,这是很短的一段黄金期。把力气花在能慢慢滚起来的事上,少花在向别人证明自己这件事上。'],
  mid:[ // 42-60
    '进度条过了一半,你大概已经认了自己不是无所不能那种人。这不算坏消息,知道边界在哪,才知道剩下的力气该往哪使。',
    '走到中段,你会发现当年以为过不去的坎,现在回头看多半只是小土坡。眼前这些也一样,再过几年就轻了。',
    '你现在的时间被切得很碎,工作和家里各要走一块。别指望留一整块给自己,能每天抠出半小时做点喜欢的,就已经赢了大多数人。'],
  late:[ // 60-80
    '进度条走过大半,你比谁都清楚哪些事值得较真,哪些根本不用搭理。这份分寸是拿几十年换来的,现在正是好好花它的时候。',
    '后面这程,身边的人会一个个变得更重要。少把时间给无关的人和事,多留给真正会陪你走到最后的那几个。',
    '你不用再向任何人证明什么了。剩下的日子,可以第一次认真问自己:接下来这段,我到底想怎么过。'],
  dusk:[ // 80-100
    '进度条快到尽头,但尽头从来不是重点,你怎么走完这段才是。想说的话说了,想见的人见了,别把遗憾留成一个句号。',
    '走到这里,你见过的日出比大多数人都多。往后每一天都比从前更值钱,慢慢用,别浪费在生气上。',
    '进度条只剩一小截,你早已不欠这个世界什么。接下来的时间,全部拿来对自己好一点,理所应当。'],
  over:[ // >=100
    '按这个预期,你的进度条已经走满了,可你还在这里读这行字,这件事本身就是赚到。别把它当催促,当成一份多给的时间。',
    '这个数字只是个平均值,不是判决书。你已经走过了大多数人以为的终点,后面每一步都是你自己多写出来的篇章。']
};
/* ── 「其实」反转(必出,治愈但不套话)── */
const TWIST=[
  '其实这个百分比没那么要紧。它只是拿平均数估出来的,真正决定你这辈子有多长的,是你把每天过得多满,而不是还剩多少天。',
  '其实进度条走到哪里都不算晚。很多人嘴里的「来不及」,不过是懒得开始的借口。你今天想做的那件事,现在就是最早的时候。',
  '其实测出多少都别慌。时间会一直往前走这件事你改不了,但剩下的时间怎么用,一直都是你说了算。',
  '其实这条进度条唯一的用处,是提醒你别再自动驾驶。它响一下,你抬头看看现在过的是不是自己想要的日子,就够了。'];
/* ── 给你的一件小事(具体、可当天做)── */
const SMALL=[
  '这周末别再瘫着刷手机了。出门走一段没走过的路,哪怕只有半小时,你会想起来生活原来不止那块屏幕。',
  '今天给一个很久没联系的人发条消息,不用有事,就说想起你了。人到最后记得的都是人,不是待办清单。',
  '今晚早睡半小时。欠自己的觉进度条不会帮你补,但今晚可以开始还。',
  '挑一件拖了很久的小事,今天做完它。不是为了效率,是想证明给自己看,你还推得动自己往前走一点。',
  '明天认真吃一顿饭,别对着屏幕扒拉两口。好好尝尝味道,那也是你活着这段时间的一部分。'];
/* ── 稀有彩蛋(加权,极低概率,按生日固定)── */
const EGG=[
  ['你出生这天在历史上挺安静,没什么大事,像是特意留给你自己写。',0.05],
  ['把你出生到现在的天数摆出来,你已经看过上万次日落了,这个量级其实很惊人。',0.05]];
/* ── 称号(按人生已用 %)── */
const TITLE=[['人生开局·空白待写',0],['上升期·正在加速',25],['过半场·认清边界',42],['后半程·懂得取舍',60],['终章将近·从容收尾',80],['圆满·多写的篇章',100]];
function titleOf(n){let t=TITLE[0][0];for(const x of TITLE)if(n>=x[1])t=x[0];return t;}
function bandOf(n){return n<25?'young':n<42?'rise':n<60?'mid':n<80?'late':n<100?'dusk':'over';}

const cfg={ id:'lifebar', 名字:'人生进度条', 图标:'⏳' };
const DAY=864e5, YEARMS=365.2425*DAY;

$('go').onclick=()=>{
  const bd=$('bd').value;
  if(!bd){$('err').textContent='先填一下出生日期吧 ⏳';return;}
  const birth=new Date(bd+'T00:00:00');
  if(isNaN(birth.getTime())){$('err').textContent='出生日期看不太懂,换个格式再填一次';return;}
  const now0=new Date();
  if(birth.getTime()>now0.getTime()){$('err').textContent='出生日期不能填成未来哦';return;}
  let lifeExp=parseInt($('exp').value,10); if(!lifeExp)lifeExp=80; lifeExp=Math.max(40,Math.min(130,lifeExp));
  let retireAge=parseInt($('ret').value,10); if(!retireAge)retireAge=60; retireAge=Math.max(40,Math.min(90,retireAge));
  let payday=parseInt($('pay').value,10); if(!payday)payday=10; payday=Math.max(1,Math.min(28,payday));
  const offStr=$('off').value||'18:00';
  const agePre=(now0.getTime()-birth.getTime())/YEARMS;
  if(agePre>120){$('err').textContent='这个年纪超出了人类纪录,检查下出生日期呀';return;}

  $('err').textContent='';$('ce-stage').style.display='none';$('loading').style.display='block';
  setTimeout(()=>{
    const now=new Date();
    const y=now.getFullYear(),m=now.getMonth(),d=now.getDate();

    /* ── 核心:全部按真实时间算(每天变)── */
    const ageYears=(now.getTime()-birth.getTime())/YEARMS;
    const lifePctNum=ageYears/lifeExp*100;
    const lifePctDisp=Math.min(999.9,lifePctNum).toFixed(1);

    // 今年 / 本月 / 本周 进度
    const yStart=new Date(y,0,1),yEnd=new Date(y+1,0,1);
    const yearPct=(now-yStart)/(yEnd-yStart)*100;
    const mStart=new Date(y,m,1),mEnd=new Date(y,m+1,1);
    const monthPct=(now-mStart)/(mEnd-mStart)*100;
    const dowMon=(now.getDay()+6)%7;                 // 周一=0 … 周日=6
    const weekStart=new Date(y,m,d-dowMon);          // 本周一 00:00
    const weekPct=(now-weekStart)/(7*DAY)*100;

    // 今天到下班(工作日 09:00 → 下班时间)
    const op=offStr.split(':'); const oh=+op[0]||18, om=+op[1]||0;
    const offHourDec=oh+om/60;
    const workStart=new Date(y,m,d,9,0,0), offTime=new Date(y,m,d,oh,om,0);
    let offPct,offDisp;
    if(now>=offTime){offPct=100;offDisp='已下班 🎉';}
    else if(now<workStart){offPct=0;offDisp='还剩 '+((offTime-workStart)/36e5).toFixed(1)+' 小时';}
    else{offPct=(now-workStart)/(offTime-workStart)*100;offDisp='还剩 '+((offTime-now)/36e5).toFixed(1)+' 小时';}

    // 距发薪
    let nextPay,lastPay,payToday=false;
    if(d<payday){nextPay=new Date(y,m,payday);lastPay=new Date(y,m-1,payday);}
    else if(d===payday){payToday=true;nextPay=new Date(y,m,payday);lastPay=new Date(y,m-1,payday);}
    else{nextPay=new Date(y,m+1,payday);lastPay=new Date(y,m,payday);}
    const payDays=Math.max(0,Math.ceil((nextPay-now)/DAY));
    const payPct=payToday?100:Math.max(0,Math.min(100,(now-lastPay)/(nextPay-lastPay)*100));
    const payDisp=payToday?'发薪日 🎉':'还剩 '+payDays+' 天';

    // 距周末(周六算周末)
    const dow=now.getDay();                            // 0 周日 … 6 周六
    const weekendNow=(dow===6||dow===0);
    let wkPct,wkDisp;
    if(weekendNow){wkPct=100;wkDisp='就是周末 🎉';}
    else{const wkDays=6-dow; wkPct=Math.max(0,Math.min(100,(now-weekStart)/(5*DAY)*100)); wkDisp='还剩 '+wkDays+' 天';}

    // 距退休
    const retLeft=retireAge-ageYears, retired=retLeft<=0;
    const retPct=Math.max(0,Math.min(100,ageYears/retireAge*100));
    const retDisp=retired?'已经自由 🎉':'还剩 '+retLeft.toFixed(1)+' 年';

    /* ── 四维 dims(headline 数字)── */
    const workPerWeek=5*Math.max(0,offHourDec-9);      // 每周搬砖小时
    const wakePerWeek=112;                             // 每周清醒小时(按每天16h)
    const workShare=Math.round(workPerWeek/wakePerWeek*100);
    const freeShare=Math.max(0,100-workShare);
    const weekendsLeft=Math.max(0,Math.round((lifeExp-ageYears)*52));
    const dims=[
      ['已用寿命%',Math.round(Math.min(100,lifePctNum))],
      ['搬砖占比%',workShare],
      ['自由%',freeShare],
      ['剩余周末',weekendsLeft]];

    /* ── 进度条全家桶(可见、不锁)── */
    const bars=[
      {name:'人生进度',pct:lifePctNum,disp:lifePctDisp+'%',hero:true},
      {name:'今年已过',pct:yearPct,disp:yearPct.toFixed(1)+'%'},
      {name:'本月已过',pct:monthPct,disp:Math.round(monthPct)+'%'},
      {name:'本周已过',pct:weekPct,disp:Math.round(weekPct)+'%'},
      {name:'今天到下班',pct:offPct,disp:offDisp},
      {name:'距发薪',pct:payPct,disp:payDisp},
      {name:'距周末',pct:wkPct,disp:wkDisp},
      {name:'距退休',pct:retPct,disp:retDisp}];
    const barsHtml='<div class="lb-bars">'+bars.map(b=>{
      const w=Math.max(0,Math.min(100,b.pct)).toFixed(1);
      return '<div class="lb-bar'+(b.hero?' lb-hero':'')+'"><div class="lb"><span>'+b.name+'</span><b>'+b.disp+'</b></div><div class="lb-tk"><div class="lb-fl" data-w="'+w+'"></div></div></div>';
    }).join('')+'</div>';

    /* ── 走心反思 / 反转 / 小事(按生日固定)── */
    const rng=CE.rngFrom(bd);                          // 生日串做种子 → 稳定
    const band=bandOf(lifePctNum);
    const reflect=CE.pick(rng,REFLECT[band]);
    const twist=CE.pick(rng,TWIST);
    const small=CE.pick(rng,SMALL);
    let egg='';EGG.forEach(e=>{if(!egg&&rng()<e[1])egg=e[0];});
    const title=titleOf(lifePctNum);

    const parts=[
      {h:'⏳ 你的人生进度条', p:''},                    // 进度条注入到这里(可见)
      {h:'🪞 一段清醒', p:reflect},
      {h:'💡 其实', p:twist},
      {h:'🌙 给你的一件小事', p:small}
    ];
    if(egg)parts.push({h:'✨ 藏了个小彩蛋', p:egg});

    const tag='【'+title+'】';
    const result={
      heading:'人生进度报告', tag, sub:bd+' · 预期 '+lifeExp+' 岁 · 退休 '+retireAge+' 岁',
      big:lifePctDisp, bigLabel:'人生已用 %', dims, parts,
      card:{kicker:'⏳ 人生进度条', title:'我的人生进度条', sub:bd+' · 预期 '+lifeExp+' 岁',
            big:lifePctDisp, bigLabel:'人生已用 %', dims, hook:reflect},
      shareText:'我的人生已用 '+lifePctDisp+'%,你敢看你的吗👉 qizh.space/ce/lifebar'
    };
    $('loading').style.display='none';
    CE.render(cfg, result);
    injectBars(barsHtml);
  },600);
};

/* 把首段(空 p)替换为进度条全家桶,并触发填充动画 */
function injectBars(html){
  const first=document.querySelector('#ce-body .ce-sec p');
  if(!first)return;
  first.innerHTML=html;first.style.margin='0';
  requestAnimationFrame(()=>{setTimeout(()=>{
    first.querySelectorAll('.lb-bar .lb-fl').forEach(el=>{el.style.width=el.dataset.w+'%';});
  },80);});
}
</script>
<script src="/wxtip.js" defer></script>
