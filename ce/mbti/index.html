    hook:['你是行走的脑暴机 + 杠精本精(褒义),什么观点到你这都能被翻个面。点子多到用不完,最烦「无聊」。','你把抬杠当成一种智力体操:不是要赢,是享受把一个想法拆开又重装的快感。','你脑子里同时开着二十个标签页,每个都是「这个说不定能成」——问题是你从不关标签页。'],
    adv:['反应快、脑洞大、嘴皮子溜,擅长在混乱里找机会、把不可能聊成可能。创意 + 忽悠(褒义)双修。','天生的破局者:所有人都说「不行」的时候,你总能找到那个没人想过的第三条路。'],

    dir:['适合表达 + 与人 + 现场感强的路:表演、销售、活动、内容,任何能站在聚光灯下发光的舞台。','别把你关进安静的格子间做重复劳动,那会让你的光熄灭——你需要人群、舞台和即时反馈。'],
    match:['ISFJ · 守护者(默默宠着你、给你安稳) / ISTJ · 物流师(帮你稳住节奏和后方)'],
    line:['「今天必须玩得开心!」','「管他呢,快乐最重要。」']}
};

const AXES=[
  {k:['E','I'],lab:['E 外向','I 内向'],qs:['q1','q2']},
  {k:['N','S'],lab:['N 直觉','S 实感'],qs:['q3','q4']},
  {k:['T','F'],lab:['T 理智','F 情感'],qs:['q5','q6']},
  {k:['J','P'],lab:['J 判断','P 感知'],qs:['q7','q8']}
];

$('go').onclick=()=>{
  $('err').textContent='';$('ce-stage').style.display='none';$('loading').style.display='block';
  setTimeout(()=>{
    let type='',dims=[];
    AXES.forEach(ax=>{
      const a=ax.k[0],b=ax.k[1];
      let ca=0,cb=0;
      ax.qs.forEach(q=>{sel[q]===a?ca++:cb++;});
      // 多数决;平票取默认(第一侧)
      const win=ca>=cb?a:b;
      const winCnt=Math.max(ca,cb),total=ca+cb;
      const pct=Math.round(winCnt/total*100); // 2:0→100, 1:1→50
      type+=win;
      const winLab=win===a?ax.lab[0]:ax.lab[1];
      dims.push([winLab,pct]);
    });
    const T=T16[type];
    // 种子=类型+8题答案串 → 同样答案永远同结果,不同答案(即使同型)文案会换一批,稳定且新鲜
    const ansSeed=type+'|'+['q1','q2','q3','q4','q5','q6','q7','q8'].map(q=>sel[q]).join('');
    const rng=CE.rngFrom(ansSeed);
    const p=arr=>CE.pick(rng,arr);
    const roast=p(T.roast), hook=p(T.hook), adv=p(T.adv), weak=p(T.weak), dir=p(T.dir), match=p(T.match), line=p(T.line);
    const tag='【'+type+' · '+T.nick+'】';
    const parts=[
      {h:'🔥 一句话毒舌锐评', p:roast},
      {h:'👤 你是这样的人', p:hook},
      {h:'💪 你的优势', p:adv},
      {h:'⚠️ 要留意的短板', p:weak},
      {h:'🎯 适合你的方向', p:dir},
      {h:'💞 和你最配的类型', p:match},
      {h:'🗣️ 你的本命口头禅', p:'「'+line+'」'}
    ];
    const result={
      heading:'你的 MBTI 人格', tag, sub:type+' · '+T.nick,
      dims, parts,
      card:{kicker:'🧭 MBTI 趣味版', title:type+' · '+T.nick, sub:'趣味版·仅供娱乐', dims, hook:roast},
      shareText:'我是 '+T.nick+'('+type+')!'+roast+' 来测你的 👉 qizh.space/ce/mbti'
    };
    $('loading').style.display='none';
    CE.render(cfg, result);
  },600);
};

const cfg={ id:'mbti', 名字:'MBTI 趣味版', 图标:'🧭' };
</script>
<script src="/wxtip.js" defer></script>
</body>
