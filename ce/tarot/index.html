  {n:'世界',    up:'圆满、通关、一个阶段的完美收官', rev:'差最后一口气、收尾在拖延、还没真正结束'}

/* 牌名 → 韦特塔罗大阿卡纳牌面图(本地自托管·公有领域 RWS 1909)。数组顺序即牌号 0–21。 */
CARDS.forEach((c,i)=>{c.img='cards/'+String(i).padStart(2,'0')+'.jpg';});

/* ── 三个位置:引子 + 收尾语 ── */
const POS=[
  {key:'过去', icon:'🕰️',
    lead:['过去这段时间,','回头看你走过的这段路,','之前悄悄埋下的伏笔是——','曾经那件让你耿耿于怀的事,'],
    tail:['它塑造了今天的你,别急着否定那段经历。','有些账现在才看懂,那是给你的功课。','把它翻篇,养分留下、包袱扔掉。','谢谢过去的自己撑到了这里。']},
  {key:'现在', icon:'🌗',
    lead:['此刻的你,','眼下的处境是——','就在这个节点,','当下最真实的状态是——'],
    tail:['顺着这股劲走,别老是自己跟自己较劲。','看清了就好办,下一步是你的选择。','沉住气,当下的每一步都算数。','别急着要答案,先把这一步走稳。']},
  {key:'未来', icon:'🌅',
    lead:['接下来的一段,','往前看,','未来的走向大概是——','如果保持现在这个节奏,'],
    tail:['方向对了,剩下的交给时间。','别怕,你比自己以为的更能扛。','保持这个频率,好事已经在路上。','结局没写死,你的选择还在改写它。']}
];

/* ── 牌阵总览(首段·截图用,加权)── */
const OVER=[
  ['你抽到的这组牌在说:该翻篇的会翻篇,别用力去抓正在离开的东西——腾出的手,是用来接新礼物的。',3],
  ['三张牌连成一条线:过去给了你底子,现在给了你选择,未来给了你答案。方向,其实你早就知道。',3],
  ['牌阵的核心能量是"松而不散"——别硬扛也别躺平,顺着当下这股劲,你会走到对的地方。',2],
  ['这次的指引很温柔也很直接:你担心的那件事,没你想得那么糟;你期待的那件事,比你以为的更近。',3],
  ['牌面在提醒你:内耗到此为止。想清楚了就去做,你缺的从来不是运气,是"先做那一下"的勇气。',2],
  ['整组牌透着一股转机的味道——一个卡了很久的局,接下来会松动。守住耐心,风要来了。',2],
  ['三张牌都在指同一个方向:回到你自己。别人的节奏参考就好,你的时区只归你管。',2],
  ['这副牌给你的不是预言,是一面镜子——它照出了你心里其实早就有的那个决定。',2]
];

/* ── 行动建议 ── */
const ACT=[
  '行动建议:今天做一件"未来的你会感谢现在的你"的小事,哪怕只花五分钟。',
  '行动建议:把纠结的能量挪去做一次,做完再评价,答案会自己浮出来。',
  '行动建议:主动联系一个人 / 结束一件拖着的事,给运势开个口子。',
  '行动建议:今晚早点睡,回满电再上;低电量时做的决定,十有八九会后悔。',
  '行动建议:写下你此刻最想要的那件事——写下来,它就开始成真了。',
  '行动建议:对那件你一直不敢的事,先迈出最小的一步。凡是没被禁止的,都是允许的。'
];

const TAGS=['顺势而为','向内看','该断就断','稳住别慌','大胆一点','把握当下','慢即是快','放下执念','相信直觉','主动出击','先松弛后发力','静待风来'];

const cfg={ id:'tarot', 名字:'塔罗抽牌', 图标:'🔮' };

/* 在结果卡顶部注入三张真实牌面图(逆位图片旋转 180°) */
function injectSpread(shown){
  const body=document.getElementById('ce-body');
  if(!body)return;
  const old=document.getElementById('tarot-spread');if(old)old.remove();
  const wrap=document.createElement('div');
  wrap.className='tarot-spread';wrap.id='tarot-spread';
  wrap.innerHTML=shown.map(c=>{
    const oc=c.rev?'to-rev':'to-up';
    return '<figure class="tcard">'
      +'<figcaption class="tpos">'+c.pos+'</figcaption>'
      +'<div class="tframe">'+(c.rev?'<span class="trev">逆位</span>':'')
      +'<img src="'+c.img+'" alt="'+c.name+'"'+(c.rev?' class="rev"':'')+' loading="eager">'
      +'</div>'
      +'<div class="tname">'+c.name+'<span class="'+oc+'">'+c.orient+'</span></div>'
      +'</figure>';
  }).join('');
  body.parentNode.insertBefore(wrap,body);
}

$('go').onclick=()=>{
  const q=$('q').value.trim();
  const hasQ=!!q;
  $('err').textContent='';$('ce-stage').style.display='none';$('loading').style.display='block';
  setTimeout(()=>{
    // 种子:有问题→同问同牌;留空→每次随机,可反复抽
    const seed=hasQ ? ('tarot|'+q) : ('tarot|rand|'+Date.now()+'|'+Math.random());
    const rng=CE.rngFrom(seed);
    // 洗牌抽 3 张(不重复)
    const deck=CARDS.slice();
    for(let i=deck.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=deck[i];deck[i]=deck[j];deck[j]=t;}
    const three=deck.slice(0,3);
    // 首段:总览
    const over=CE.wpick(rng,OVER);
    const parts=[{h:'🔮 牌阵总览 · 核心指引', p:over}];
    // 三张逐位解读(锁区)+ 牌面图数据
    const shown=[];
    three.forEach((card,i)=>{
      const pos=POS[i];
      const rev=rng()<0.45;                 // 正位略多一点
      const orient=rev?'逆位':'正位';
      const mean=rev?card.rev:card.up;
      const lead=CE.pick(rng,pos.lead);
      const tail=CE.pick(rng,pos.tail);
      shown.push({pos:pos.key, name:card.n, rev, orient, img:card.img});
      parts.push({h:pos.icon+' '+pos.key+'位 · '+card.n+'('+orient+')',
        p:lead+'你翻开的是「'+card.n+' · '+orient+'」——'+mean+'。'+tail});
    });
    // 行动建议(锁区)
    parts.push({h:'🧭 给你的一句行动建议', p:CE.pick(rng,ACT)});

    const kw=CE.pick(rng,TAGS);
    const tag='【'+kw+'】';
    const energy=Math.min(99,Math.round(60+rng()*39));
    const dims=[
      ['🔮指引',Math.min(99,66+Math.round(rng()*33))],
      ['🍀时运',Math.min(99,58+Math.round(rng()*41))],
      ['💗情感',Math.min(99,58+Math.round(rng()*41))],
      ['💰财运',Math.min(99,58+Math.round(rng()*41))]];
    const spread=three.map(c=>c.n).join(' · ');
    const sub=hasQ ? ('问:'+(q.length>18?q.slice(0,18)+'…':q)) : '你心里默念的那个问题 · 牌都懂';

    const result={
      heading:'你的塔罗三牌阵', tag, sub,
      big:energy, bigLabel:'能量指数', dims, parts,
      card:{kicker:'🔮 塔罗抽牌', title:kw, sub:spread, big:energy, bigLabel:'能量指数', dims, hook:over,
            cards:shown.map(c=>({pos:c.pos, name:c.name, rev:c.rev, img:c.img}))},
      shareText:'我抽到的塔罗指引是「'+kw+'」,来抽你的 👉 qizh.space/ce/tarot'
    };
    $('loading').style.display='none';
    CE.render(cfg, result);
    // 结果页顶部插入真·牌面三张(不进锁区,先给"看图"的爽点)
    injectSpread(shown);
  },600);
};
</script>
