/* ── 幸运库 ── */
const LUCKY_COLOR=['明黄色','雾霾蓝','奶油白','正红色','薄荷绿','香芋紫','燕麦棕','珊瑚粉','墨黑色','橄榄绿','天空蓝','焦糖橘','酒红色','银灰色','克莱因蓝','脏橘色','抹茶绿','奶茶色','雾粉色','孔雀绿','丁香紫','象牙白','复古卡其','樱花粉','午夜蓝','蜜桃橘','水泥灰','枫叶红','薰衣草紫','鼠尾草绿'];
const LUCKY_ITEM=['一杯冰美式','没戴过的那顶帽子','充满电的耳机','口袋里的一枚硬币','早上第一条收到的表情包','一支久违的笔','桌角那盆绿植','喝了一半的奶茶','手机里最旧的一张照片','一双干净的白袜子','放在包底的那颗糖','一张便利贴','循环了一整周的那首歌','刚洗好的一件白T','抽屉里的口香糖','窗台照进来的那束光','钥匙扣上的小挂件','一杯温开水','没拆封的一包纸巾','刚换的新壁纸'];
const YI=['主动开口','早睡','出门走走','把想说的话说出来','断舍离一件旧物','请朋友吃饭','完成一件拖延的事','复盘总结','大胆表白/示好','投资自己','说不','独处充电','换个发型/穿搭','删掉消耗你的联系人','认真吃顿早饭','给爸妈打个电话','把工位/房间收拾干净','夸一个陌生人','关掉消息通知专注两小时','记一笔账','散步二十分钟','抢先发那条一直没发的消息','奖励自己一杯好喝的','列一张明天的清单'];

/* ── 稀有彩蛋(加权,极低概率)── */
const RARE=[['天选锦鲤日·万事皆宜',0.03],['小宇宙暴击·今日气运封顶',0.04],['贵人绕身·好事成双',0.05]];

/* 星座 → Unicode 星座符号(公有领域字符,无需外链图) */
const SGN={白羊座:'♈',金牛座:'♉',双子座:'♊',巨蟹座:'♋',狮子座:'♌',处女座:'♍',天秤座:'♎',天蝎座:'♏',射手座:'♐',摩羯座:'♑',水瓶座:'♒',双鱼座:'♓'};
function injectSign(s){
  const body=document.getElementById('ce-body');if(!body)return;
  const old=document.getElementById('xz-sign');if(old)old.remove();
  const d=document.createElement('div');d.className='xz-sign';d.id='xz-sign';
  d.innerHTML='<div class="g">'+(SGN[s]?SGN[s]+'︎':'⭐')+'</div><span class="nm">'+s+'</span>';
  body.parentNode.insertBefore(d,body);
}

$('go').onclick=()=>{
  $('err').textContent='';$('ce-stage').style.display='none';$('loading').style.display='block';
  setTimeout(()=>{
    const today=new Date().toISOString().slice(0,10);   // 当天日期 → 每天自动换
    const seed=sign+'@'+today;                           // 星座+日期 → 同天同星座固定
    const rng=CE.rngFrom(seed);
    const parts=CE.buildParts(cfg,rng);

    // 稀有彩蛋(加权)
    let rare='';RARE.forEach(r=>{if(!rare&&rng()<r[1])rare=r[0];});

    // 幸运提示 + 宜忌(锁区)
    const luckyColor=CE.pick(rng,LUCKY_COLOR);
    const luckyNum=1+Math.floor(rng()*9);
    const luckyItem=CE.pick(rng,LUCKY_ITEM);
    let yi=CE.pick(rng,YI), ji=CE.pick(rng,JI);
    parts.push({h:'🍀 今日幸运提示', p:'幸运色:'+luckyColor+'　·　幸运数字:'+luckyNum+'\n幸运物:'+luckyItem+'(今天带上它,好运随身)\n开运心法:把注意力从别人身上收回来放回自己,今天你就是自己的锦鲤。'});
    parts.push({h:'✅ 今日宜 / 🚫 今日忌', p:'【宜】'+yi+'\n【忌】'+ji});
    if(rare)parts.push({h:'✨ 隐藏彩蛋', p:'你今天抽到了「'+rare+'」——这种日子一年没几天,大胆去做那件你一直想做的事!'});

    const tag='【'+CE.pick(rng,TAG1)+'·'+CE.pick(rng,TAG2)+'】';
    // 综合指数(有彩蛋则封顶高分)
    /* 四维先出(彩蛋日整体抬升基线);注意首维改成「心情」——原来叫「综合」和总分语义撞车 */
    const _D=(lo,hi)=>Math.min(99,Math.round(lo+rng()*(hi-lo)));
    const dims=[
      /* 偏高是刻意的:运势类看到低分会不爽,好话才有转发欲 */
      ['💛心情',rare?_D(92,99):_D(72,97)],
      ['💗爱情',rare?_D(91,99):_D(70,97)],
      ['💰财运',rare?_D(91,99):_D(70,97)],
      ['💼事业',rare?_D(91,99):_D(70,97)]];
    /* 今日运势 = 四维加权平均 + 微扰,锁死在四维区间内 */
    const _dv=dims.map(d=>d[1]);
    const score=Math.max(Math.min(..._dv),Math.min(Math.max(..._dv),
      Math.round(0.28*_dv[0]+0.24*_dv[1]+0.24*_dv[2]+0.24*_dv[3]+(rng()*4-2))));

    const result={
      heading:'今日运势', tag, sub:sign+' · '+today,
      big:score, bigLabel:'今日运势', dims, parts,
      card:{kicker:'⭐ 今日运势 · 星座', title:sign+' '+tag, sub:today, big:score, bigLabel:'今日运势', dims, hook:(parts[0]&&parts[0].p)||''},
      shareText:'我今天的运势 '+score+' 分!'+tag+' 来看你的 👉 qizh.space/ce/xingzuo'
    };
    $('loading').style.display='none';
    CE.render(cfg, result);
    injectSign(sign);
  },600);
};
