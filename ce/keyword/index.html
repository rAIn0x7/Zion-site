<script>
const $=id=>document.getElementById(id);
const sel={q1:'猫',q2:'搞钱',q3:'满电',q4:'硬刚'};
['q1','q2','q3','q4'].forEach(q=>{

/* ── 本命关键词库(加权,首段截图用)── */
const KW=[
  ['野生生命力',3],['清醒搞钱',3],['松弛感本命',3],['破局者',2],['稳中带浪',2],
  ['温柔一刀',2],['向阳而生',3],['闷声干大事',2],['反脆弱',2],['回血中',2],
  ['独狼美学',2],['小宇宙待爆发',2],['主角光环',2],['暗涌',1.5],['长期主义',2],
  ['热血续航',2],['先松弛后发力',2],['野心藏不住',2],['自愈体质',2],['风口体质',1.5],
  ['钝感力 MAX',2],['嘴强王者',2],['低调狠人',2],['情绪稳定器',2],['搞事业脑',2],

/* ── 分段内容库 ── */
const cfg={ id:'keyword', 名字:'本命关键词', 图标:'🔮',
  sections:[
    {h:'🌤️ 今年的你', pools:[[
      ['今年你处在一个"外面看着稳、里面正偷偷升级"的阶段——别急,火候到了自然跳级。',3],
      ['今年是你的"重启年",很多旧的东西该断的会断,腾出来的地方全是新剧本。',3],
      ['今年你像开了倍速,想法多、动作快,唯一要防的是把自己熬空,记得留油。',2],
      ['今年你从"取悦别人"慢慢切到"取悦自己",这个转变,是今年最值钱的成长。',3],
      ['今年表面平静,水下暗流很足——一件憋了很久的事,会在下半年冒头。',2],
      ['今年你在"想很多"和"做一点"之间反复横跳,别自责,先做的那一点才算数。',2],
      ['今年你的关键词是"筛选":筛人、筛事、筛信息,留下的都是真正对你好的。',2],
      ['今年你终于愿意对自己诚实一点,承认想要什么、不想忍什么——这就是转运的开始。',2],
      ['今年你像刚更新完系统的手机,有点卡顿是正常的,过阵子就跑得比谁都顺。',2],
      ['今年你会经历一次"断舍离式"的清爽,扔掉几个人、几件事,忽然就轻了。',2],
      ['今年你嘴上喊着躺平,身体却很诚实地在偷偷努力,这种拧巴其实是好事。',2],
      ['今年你最大的变化是脸皮变厚了——不是变坏,是终于不那么在意别人的眼光了。',3],
      ['今年你会突然对某件事上头,一头扎进去,这股劲儿别浪费,它可能是条新路。',2],
      ['今年你从"什么都想要"进化到"只要重要的那几样",人一下就清爽了。',2],
      ['今年你会遇到几个让你想翻白眼的人,别气,他们是来帮你练钝感力的。',1.5],
      ['今年你的运气藏在"再坚持一下"里,好几次你想放弃的地方,其实差一步就到了。',2],
      ['今年你像春天的种子,表面没动静,地底下的根正拼命扎——沉住气。',2],
      ['今年你会想通一件憋了很久的事,想通那天,整个人像被重启,轻装上阵。',2]]]},
    {h:'🧭 运势提点', pools:[[
      ['贵人在"弱关系"里——那个你不常联系、点头之交的人,今年可能给你递把梯子。',3],
      ['财气跟着"作品"走:把你会的东西做成能被看见的成果,钱是结果不是目标。',3],
      ['桃花藏在"共同做一件事"里,别硬社交,去做你真喜欢的事,人自然对上频。',2],
      ['最大的坑是"内耗":你想三天不如做一次,把纠结的能量挪去行动,运势立刻回正。',3],
      ['今年宜"减法":砍掉一个一直在耗你的人/事,空出来的运气会补到该来的地方。',2],
      ['机会来的时候不会敲门,是擦肩而过——今年练一个本事:看到就先接住,再慢慢想。',2],
      ['别在低电量时做大决定。等你回满血,同一件事的答案可能完全不一样。',2],
      ['今年你越"松",反而越顺;越"用力证明",越容易拧巴。松弛是你的隐藏运势加成。',2],
      ['今年忌"比较":别人的进度条跟你半毛钱关系没有,盯着自己那条就行。',2],
      ['财运在"复利"里,不在"暴富"里——今年埋的小种子,明后年才轮到你收。',2],
      ['今年小心"三分钟热度"这个隐形杀手,选一件事死磕,比样样浅尝有用一百倍。',2],
      ['贵人可能是个"看起来不好惹"的人,别被外壳劝退,硬着头皮聊一次准有收获。',2],
      ['今年你该学会"厚脸皮求助",很多门你以为锁着,其实只是你没敢推。',2],
      ['运势旺在"下班后"——那个你偷偷做的小爱好,今年很可能给你开一扇意外的门。',2],
      ['今年别把好牌捂在手里等完美时机,完美时机不存在,先出牌的人才有机会赢。',2],
      ['今年你的桃花和贵人都怕吵,越是安安静静做自己,对的人越容易被你吸过来。',1.5],
      ['今年破财挡灾是真的,该花的钱别抠;但冲动消费的坑也要防,分清哪个是哪个。',1.5],
      ['今年最该投资的是你自己:一门手艺、一副好身体,比追任何风口都稳。',2]]]},
    {h:'💌 给你的一句话', pools:[[
      ['你不是慢,你是在攒一个别人偷不走的底盘——沉住气,后半程是你的。',3],
      ['你已经比你以为的更勇敢了,继续往前走,别回头找那些不值得的人确认。',3],
      ['把"我可以"说给自己听,别等别人发许可证——你的人生不用审批。',2],
      ['允许自己慢一点、废一会儿,你不是机器,回血也是正经事。',2],
      ['你想要的那个版本的自己,不是变成别人,是把本来的你放大——继续。',3],
      ['凡是没被明确禁止的,都是允许的。今年,大胆去试那件你一直不敢的事。',2],
      ['别把光都照给别人,记得也留一束给自己——你值得被自己好好对待。',2],
      ['你不需要所有人都懂你,一个真正看见你的人,顶过一百个点赞。',2],
      ['你羡慕的那种"活得通透",其实你已经在路上了,只是自己还没发现。',2],
      ['别用别人的时区量自己的进度,花有花期,你只是还没轮到而已。',2],
      ['你熬过的那些"没人看见的夜",总有一天会变成别人嘴里的"运气真好"。',3],
      ['累了就歇,别硬扛;世界不会因为你歇一下就塌,但你会因为硬扛而垮。',2],
      ['你不是不够好,你只是被放错了地方——换个鱼缸,你就是最亮的那条鱼。',2],
      ['别急着给自己下定义,你还在连载,现在剧透结局太早了。',2],
      ['你对自己狠一点没关系,但也请对自己温柔一点,张弛有度才走得远。',2],
      ['那些让你难堪的时刻,日后都会变成你的下酒段子——熬过去就是你的。',1.5],
      ['你值得的,从来不用抢;是你的,绕地球一圈也会回到你手里。',1.5],
      ['别怕起步晚,人生不是短跑,是一场看谁笑到最后的马拉松。',2]]]}
  ]};

const TAG1=['清醒','松弛','野生','温柔','热血','佛系','搞钱','自由','元气','内核稳','钝感','高能','低调','嘴硬','清冷','鬼马','稳健','反卷'];
const TAG2=['行动派','理想家','实干家','浪漫家','独行侠','破局者','氛围组','守护者','冒险家','长期主义者','显眼包','嘴替','养生咖','搞钱能手','细节控','气氛担当','头号玩家','躺赢派'];
const RARE=[['万里挑一·天选气运',0.04],['隐藏款·大器晚成',0.05],['本命暴击·风口体质',0.04],['SSR·行走的锦鲤',0.03],['隐藏神格·闷声发大财',0.04],['限定款·越老越吃香',0.03]];

$('go').onclick=()=>{
  $('err').textContent='';$('ce-stage').style.display='none';$('loading').style.display='block';
  setTimeout(()=>{
    const seed=[sel.q1,sel.q2,sel.q3,sel.q4].join('|');
    const rng=CE.rngFrom(seed);
    const keyword=CE.wpick(rng,KW);
    const parts=CE.buildParts(cfg,rng);
    parts.unshift({h:'🔑 你的本命关键词', p:'「'+keyword+'」'});
    // 稀有特殊(加权)
    let rare='';RARE.forEach(r=>{if(!rare&&rng()<r[1])rare=r[0];});
    if(rare)parts.push({h:'✨ 隐藏彩蛋', p:'你抽到了「'+rare+'」——这个组合不多见,今年请对自己更狠一点(褒义)。'});
    const tag='【'+CE.pick(rng,TAG1)+CE.pick(rng,TAG2)+'】';
    const base=rare?Math.round(90+rng()*9):Math.round(62+rng()*35);
    const score=Math.min(99,base);
    const dims=[
      ['🔋能量',Math.min(99,60+Math.round(rng()*39))],
      ['🍀运势',Math.min(99,60+Math.round(rng()*39))],
      ['💗桃花',Math.min(99,58+Math.round(rng()*41))],
      ['💰财气',Math.min(99,60+Math.round(rng()*39))]];
    const summary='像'+sel.q1+' · 想要'+sel.q2+' · 电量'+sel.q3;
    const result={
      heading:'你的本命关键词', tag, sub:summary,
      big:score, bigLabel:'本命指数', dims, parts,
      card:{kicker:'🔮 本命关键词', title:'「'+keyword+'」', sub:tag, big:score, bigLabel:'本命指数', dims, hook:'「'+keyword+'」'},
      shareText:'我的本命关键词是「'+keyword+'」!'+tag+' 来测测你的 👉 qizh.space/ce/keyword'
    };
    $('loading').style.display='none';
    CE.render(cfg, result);
  },600);
};
</script>
