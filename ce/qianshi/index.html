$('go').onclick=()=>{
  const nm=$('nm').value.trim();
  if(!nm){$('err').textContent='先写下你的名字呀 🪷';return;}

  setTimeout(()=>{
    const seed=nm+'|'+sex;
    const rng=CE.rngFrom(seed);
    const role=CE.wpick(rng,ROLES);
    const key=sex==='女'?'f':sex==='不限'?'n':'m';

      ['🕯️前世羁绊',Math.min(99,60+Math.round(rng()*39))],

      big:soul, bigLabel:'灵魂年龄(岁)', dims, parts,
